[project]
name = "brixzle"
version = "0.1.0"
description = "Recursive self-improving loop for designing drone-placeable brick families"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brixzle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
