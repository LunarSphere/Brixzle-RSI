[project]
name = "brixzle"
version = "0.1.0"
description = "Recursive self-improving loop for designing drone-placeable brick families"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery>=2.5",
    "coacd==1.0.14",
    "matplotlib>=3.8",
    "mujoco==3.16.0",
    "numpy>=2,<3",
    "py-bobyqa>=1.5.0",
    "pyyaml>=6.0.3",
    "rtree>=1.3",
    "scipy>=1.14,<2",
    "shapely>=2.0",
    "trimesh>=4.12.2,<5",
]

[project.optional-dependencies]
# The design agent, the critic and the intake classifier run on the Claude Agent SDK. Only real runs
# need it; the tests use a scripted runner and never import it (agents/runner.py).
agents = ["claude-agent-sdk>=0.2.180"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brixzle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
