# Base requirements R1–R13 as data. Loaded by brixzle.requirements.
# Keep in step with the table in docs/requirements.md: the tests check that
# ids, names, text and check kinds agree. Change only in a reviewed PR.
# Rewritten for the error-radius goal (#206).
#
# checks: one or more of
#   rule       an analytic check that runs before any simulation
#   sim        a simulated trial
#   design     a fixed design choice
#   predictor  the analytic predictor (quasi-static, 2D)
#
# status (optional): active (the default) or deferred. A deferred requirement
# stays in the list, but the loop does not score it and the design agent does
# not design for it. docs/requirements.md says why, under "Deferred
# requirements".

requirements:
  - id: R1
    name: Generality
    text: "Bricks must build the structures the demo needs, a stack and a back-first overhang; walls, bridges and rings are reported for finalists."
    checks: [sim]

  - id: R2
    name: Voxelizable
    text: "Bricks must sit on a voxel lattice so that structures can later be planned algorithmically; for now a brick spans two voxels."
    checks: [design]

  - id: R3
    name: Rigidity
    text: "Assemblies must be rigid and physically stable."
    checks: [sim]

  - id: R4
    name: Overhang
    text: "An overhang must accept at least 3 reaching bricks without falling over; more is better."
    checks: [sim]

  - id: R5
    name: Biased error
    text: "The drone will make placement errors; a design may bias the error onto one side and use that slope as the guide, as a suggestion (design rule DR20), not a requirement."
    checks: [design]
    status: deferred

  - id: R6
    name: Steep guides
    text: "A guide ramp must be steeper than its friction coefficient requires (tan θ > μ, with margin)."
    checks: [rule]

  - id: R7
    name: Alternating angles
    text: "Alternating the lean between courses may improve stability."
    checks: [design]
    status: deferred

  - id: R8
    name: Stiffness
    text: "I-beam-like sections may be used to stop the brick from flexing. The first course sits on a stable base."
    checks: [design]
    status: deferred

  - id: R9
    name: Mass
    text: "A brick, with its steel insert, must weigh between 1 g and 25 g in PLA; lighter is preferred."
    checks: [rule]

  - id: R10
    name: Grippable
    text: "Each brick carries a magnet target on its top face, near its centre of mass, for a passive magnet gripper that the drone releases by yawing. The combined mass of the brick and the gripper must not be more than 35 g, the drone's payload limit."
    checks: [rule]

  - id: R11
    name: Coarse placement
    text: "The drone places bricks with 16 to 40 mm of error, and a brick must seat by its own geometry; the score is the largest error radius inside which every placement type always seats (the green zone)."
    checks: [sim]

  - id: R12
    name: Coarse pickup
    text: "The drone picks bricks up from a landing pad that absorbs its error; the brick only has to offer the magnet target (R10)."
    checks: [design]
    status: deferred

  - id: R13
    name: Printable
    text: "A brick must print as one PLA piece plus a steel insert, with walls of at least 1.2 mm and joint gaps of about 0.2 mm or more."
    checks: [rule]
